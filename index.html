:root{--marble:#1d4560;--foam:#4d7690;--gold:#a38541;--goldtx:#7a5f22;--accent:#c85f55;--line:rgba(163,133,65,.4);
--serif:'Cardo','Gowun Batang',serif;--sans:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);color:var(--marble);line-height:1.85;-webkit-font-smoothing:antialiased;
background:linear-gradient(#e6f5ff,#d6edff);background-attachment:fixed}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}

/* 상단 슬라이드 */
.top{max-width:1100px;width:100%;margin:0 auto}
.slider{position:relative;touch-action:pan-y;user-select:none}
.view{overflow:hidden;aspect-ratio:var(--r,1.4615);-webkit-mask-image:linear-gradient(#000 68%,transparent 100%);mask-image:linear-gradient(#000 68%,transparent 100%)}
.slides{display:flex;height:100%;transition:transform .9s cubic-bezier(.6,0,.2,1)}
.slide{flex:0 0 100%;height:100%}
.slide img,.ph{width:100%;height:100%;display:block}
.slide img{object-fit:cover;object-position:50% 20%;pointer-events:none}
.nav{position:absolute;top:36%;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#ffffff8c;font-size:1.4rem;line-height:1}
.prev{left:12px}.next{right:12px}
.dots{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:flex-end;gap:10px;padding-right:5%}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:1px solid var(--goldtx);background:none}
.dots button.on{background:var(--goldtx)}
.slider.one .nav,.slider.one .dots{display:none}
.intro{text-align:left;padding:0 28px 8px calc(3% + clamp(4.4rem,15vw,9.5rem)*.22);margin-top:0;position:relative}
.sig{position:absolute;left:3%;bottom:4%;margin:0;padding:.1em .22em;z-index:2;pointer-events:none;white-space:nowrap;
font-family:"Pencerio-Hairline","Gowun Batang",serif;font-weight:50;font-size:clamp(4.4rem,15vw,9.5rem);line-height:1.05;
color:#fff;-webkit-text-stroke:1.2px #fff;text-shadow:0 0 2px rgba(25,80,125,.55),0 3px 16px rgba(35,100,150,.5)}
.tagline{margin:0;max-width:34em;font-family:'Gowun Batang',var(--serif);font-size:1.08rem;line-height:2;word-break:keep-all}
@media (prefers-reduced-motion:no-preference){
.page.on .slider{animation:rise 1.1s cubic-bezier(.16,.8,.24,1) both}
.page.on .sig{-webkit-mask-image:linear-gradient(90deg,#000 40%,transparent 48%);mask-image:linear-gradient(90deg,#000 40%,transparent 48%);-webkit-mask-size:250% 100%;mask-size:250% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;animation:write 1.5s cubic-bezier(.4,.1,.3,1) .7s both}
.page.on .intro>*,.page.on .plaque-row{animation:fade .8s ease 1.6s both}}
@keyframes write{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes rise{from{opacity:0;transform:translateY(-110px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* 전체 화면 장면 넘기기 */
html,body{height:100%}
.intro .tagline{white-space:pre-line}
.intro .rich{white-space:normal;margin-top:12px;word-break:keep-all}
.rich img{max-width:100%;height:auto;vertical-align:bottom}
.rich[hidden],.plaque[hidden]{display:none}
.plaque-row{display:flex;justify-content:center;margin:56px 0 8px;padding:0 28px}
.plaque-row:has(.plaque[hidden]){display:none}
.plaque{padding:13px 28px;border:1px solid var(--gold);outline:1px solid var(--line);outline-offset:5px;text-align:center}
.plaque b{display:block;font-family:var(--serif);font-weight:700;font-size:1.05rem;line-height:1.4;letter-spacing:.35em;padding-left:.35em;color:var(--marble)}
.plaque span{display:block;margin-top:12px;font-family:var(--serif);font-size:.8rem;line-height:1.4;letter-spacing:.22em;padding-left:.22em;color:var(--goldtx)}
#pager{position:fixed;inset:0}
.page{position:absolute;inset:0;display:flex;align-items:center;padding:0 0 72px;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.page.on{opacity:1;visibility:visible;transition-delay:0s}
.page>.top{--r:1.4615;--rest:280px;width:min(1100px,100vw,calc((100vh - var(--rest)) * var(--r)));width:min(1100px,100vw,calc((100dvh - var(--rest)) * var(--r)));display:flex;flex-direction:column;max-height:100%;padding-top:max(12px,env(safe-area-inset-top))}
.page .view{width:100%}
@media (max-width:760px){
.page{align-items:flex-start}
.page>.top{width:100%;padding-top:0}
.page .view{max-height:calc(100vh - var(--rest));max-height:calc(100dvh - var(--rest))}
}
.intro{min-height:0;overflow-y:auto;scrollbar-width:none}
.intro::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){.page{transition:none}}
.link{position:fixed;left:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:30;opacity:.55;background:none;border:0;color:var(--goldtx);font-size:.85rem;text-decoration:underline}

/* 관리 */
.bar{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:none;gap:8px;z-index:40}
.bar.on{display:flex}
.btn{padding:8px 18px;border:1px solid var(--gold);background:#f3faffe6;border-radius:2px}
.btn.go{background:var(--goldtx);color:#fff;font-weight:700}
dialog{border:0;background:transparent;color:var(--marble);max-width:92vw;max-height:92vh;padding:0}
dialog::backdrop{background:rgba(30,70,100,.55)}
.sheet{width:min(560px,92vw);background:#f3faff;border:1px solid var(--gold);padding:24px;overflow:auto;max-height:88vh}
.sheet h3{font-family:var(--serif);margin-bottom:14px}
.sheet label{display:block;margin-top:12px;font-size:.9rem;color:var(--goldtx)}
.sheet input,.sheet textarea{width:100%;margin-top:4px;padding:8px 10px;font:inherit;color:var(--marble);background:#fff;border:1px solid var(--line);border-radius:2px}
.sheet textarea{min-height:90px;resize:vertical}
.sheet.wide{width:min(760px,94vw)}
.sheet .lab{margin-top:14px;font-size:.9rem;color:var(--goldtx)}
.rtbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;padding:6px;border:1px solid var(--line);background:#e6f4ff}
.rtbar+.rtbar{margin-top:0;border-top:0}
.rtbar button,.rtbar select{height:32px;min-width:32px;padding:0 8px;border:1px solid var(--line);background:#fff;border-radius:2px;font-size:.85rem;color:var(--marble)}
.rtbar .mini{display:inline-flex;align-items:center;gap:4px;margin:0;font-size:.8rem;color:var(--marble)}
.rtbar input[type=color]{width:34px;height:32px;margin:0;padding:0;border:1px solid var(--line);background:#fff}
.rtbar input[type=text]{flex:1 1 180px;width:auto;height:32px;margin:0;padding:0 8px;font-size:.85rem}
.rtbar .sep{width:1px;height:22px;background:var(--line)}
.rte{min-height:220px;max-height:46vh;overflow:auto;padding:10px 12px;background:#fff;border:1px solid var(--line);border-top:0;font-family:'Gowun Batang',var(--serif);font-size:1.08rem;line-height:2;color:var(--marble);outline:none}
.rte:focus{border-color:var(--gold)}
.rte:empty::before{content:attr(data-ph);color:#8fb0c4}
.rte img{max-width:100%;height:auto;cursor:pointer}
.rte img.sel{outline:2px solid var(--accent)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.msg{margin-top:10px;font-size:.9rem;color:var(--accent);min-height:1.2em}

/* 물거품 */
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.bub{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);will-change:transform;animation:up var(--d) cubic-bezier(.3,.3,.6,1) var(--w) both}
.bub i{position:absolute;inset:0;border:1px solid rgba(80,150,210,.35);border-radius:var(--b1);
background:radial-gradient(circle,rgba(255,255,255,.1) 52%,rgba(120,190,235,.25) 80%,rgba(255,255,255,.6) 100%);
box-shadow:inset calc(var(--s)*.1) 0 calc(var(--s)*.18) rgba(60,150,230,.35),inset calc(var(--s)*-.1) 0 calc(var(--s)*.18) rgba(255,150,205,.3),inset 0 calc(var(--s)*-.1) calc(var(--s)*.16) rgba(255,225,140,.28),0 0 calc(var(--s)*.3) rgba(255,255,255,.7);
animation:sway var(--sw) ease-in-out var(--w) infinite alternate,blob var(--bl) ease-in-out infinite alternate}
.bub i::before{content:"";position:absolute;left:20%;top:14%;width:28%;height:17%;border-radius:50%;background:rgba(255,255,255,.95);transform:rotate(-35deg)}
@keyframes up{0%{transform:translate(0,0) scale(.3);opacity:0}10%{opacity:1}50%{transform:translate(var(--mx),calc(var(--dy)*-.5)) scale(.95)}100%{transform:translate(var(--ex),calc(var(--dy)*-1)) scale(1.1);opacity:0}}
@keyframes sway{from{transform:translateX(calc(var(--dx)*-1)) scale(1.07,.93)}to{transform:translateX(var(--dx)) scale(.93,1.07)}}
@keyframes blob{from{border-radius:var(--b1)}to{border-radius:var(--b2)}}
.rip{position:absolute;left:var(--x);top:var(--y);width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:1px solid rgba(80,150,210,.5);animation:rip .9s ease-out both}
@keyframes rip{from{transform:scale(.1);opacity:.9}to{transform:scale(1.4);opacity:0}}

</style>
</head>
<body>
<div id="bubbles"></div>

<div id="pager">
<section class="page on">
<header class="top">
  <div class="slider" id="slider" aria-roledescription="carousel">
    <div class="view"><div class="slides" id="slides"></div></div>
    <button class="nav prev" id="prev" type="button" aria-label="이전 이미지">‹</button>
    <button class="nav next" id="next" type="button" aria-label="다음 이미지">›</button>
    <div class="dots" id="dots"></div>
    <h1 class="sig" id="sig"></h1>
  </div>
  <div class="plaque-row"><div class="plaque" id="plaque"><b id="pName"></b><span id="pSub"></span></div></div>
  <div class="intro">
    <div class="tagline rich" id="detail" hidden></div>
  </div>
</header>
</section>
</div>

<button class="link" id="adminLink" type="button">관리자</button>

<div class="bar" id="bar">
  <button class="btn go" id="editBtn" type="button">편집</button>
  <button class="btn" id="outBtn" type="button">로그아웃</button>
</div>

<dialog id="login"><form class="sheet" id="loginForm">
  <h3>관리자 로그인</h3>
  <label>이메일<input type="email" id="em" required autocomplete="username"></label>
  <label>비밀번호<input type="password" id="pw" required autocomplete="current-password"></label>
  <p class="msg" id="loginMsg"></p>
  <div class="acts"><button class="btn" type="button" data-close>닫기</button><button class="btn go">로그인</button></div>
</form></dialog>

<dialog id="editor"><form class="sheet" id="editForm">
  <h3>프로필 편집</h3><div id="fields"></div>
  <p class="msg" id="editMsg"></p>
  <div class="acts"><button class="btn" type="button" data-close>닫기</button><button class="btn go">저장</button></div>
</form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== 설정: 수퍼베이스 값을 넣으세요 (Project Settings > API) ===== */
const CFG = { SUPABASE_URL: "", SUPABASE_ANON_KEY: "", TABLE: "oc_profile" };

const DEFAULT = {
  name: "테티스", nameEn: "Thetis", nameSub: "ΘΕΤΙΣ", inscription: "ΝΗΡΕΩΣ ΘΥΓΑΤΗΡ", detail: "",
  accent: "#c85f55", slides: []
};

let DATA = JSON.parse(JSON.stringify(DEFAULT)), sb = null;
const $ = id => document.getElementById(id);
const ok = u => /^https?:\/\//i.test(u || "");

const PH = `<svg class="ph" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="일러스트를 넣어 주세요"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd3ee"/><stop offset="1" stop-color="#e2f3ff"/></linearGradient></defs><rect width="300" height="400" fill="url(#g)"/><text x="150" y="200" text-anchor="middle" fill="#4d7690" font-size="13">일러스트를 넣어 주세요</text></svg>`;

/* ---- 서식 글 정리(안전한 태그·스타일만 통과) ---- */
const OKTAG = new Set(["B","STRONG","I","EM","U","S","STRIKE","DEL","SPAN","DIV","P","BR","IMG","FONT","UL","OL","LI","H1","H2","H3","BLOCKQUOTE","SUB","SUP","A"]);
const DROP = new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","LINK","META","SVG","MATH","FORM","INPUT","BUTTON","TEXTAREA","SELECT","VIDEO","AUDIO","CANVAS","NOSCRIPT","TEMPLATE"]);
const OKCSS = new Set(["color","background-color","font-size","font-weight","font-style","font-family","text-decoration","text-decoration-line","text-align","width","max-width","height","margin","margin-left","margin-right","margin-top","margin-bottom","display","line-height","letter-spacing"]);
function cleanStyle(st) {
  return st.split(";").map(x => x.trim()).filter(Boolean).map(d => {
    const i = d.indexOf(":"); if (i < 0) return "";
    const k = d.slice(0, i).trim().toLowerCase(), v = d.slice(i + 1).trim();
    if (!OKCSS.has(k) || !v) return "";
    if (!/^[\w\s#%.,()'"\-가-힣\/]+$/.test(v) || /url|expression|javascript|import/i.test(v)) return "";
    return k + ":" + v;
  }).filter(Boolean).join(";");
}
function clean(html) {
  const doc = new DOMParser().parseFromString("<body>" + html + "</body>", "text/html");
  (function walk(node) {
    [...node.childNodes].forEach(c => {
      if (c.nodeType === 3) return;
      if (c.nodeType !== 1) { c.remove(); return; }
      const t = c.tagName;
      if (DROP.has(t)) { c.remove(); return; }
      if (!OKTAG.has(t)) { walk(c); c.replaceWith(...c.childNodes); return; }
      [...c.attributes].forEach(a => {
        const n = a.name.toLowerCase(), v = a.value;
        if (n === "style") { const cs = cleanStyle(v); cs ? c.setAttribute("style", cs) : c.removeAttribute("style"); }
        else if (t === "IMG" && n === "src") { if (!/^(https?:\/\/|data:image\/(png|jpe?g|gif|webp);base64,)/i.test(v)) c.removeAttribute("src"); }
        else if (t === "IMG" && (n === "alt" || n === "width")) { /* 허용 */ }
        else if (t === "A" && n === "href") { if (!/^https?:\/\//i.test(v)) c.removeAttribute("href"); }
        else if (t === "FONT" && (n === "color" || n === "size" || n === "face")) { /* 허용 */ }
        else if (n === "align") { /* 허용 */ }
        else c.removeAttribute(n);
      });
      if (t === "IMG" && !c.getAttribute("src")) { c.remove(); return; }
      if (t === "A") { c.setAttribute("target", "_blank"); c.setAttribute("rel", "noopener noreferrer"); }
      walk(c);
    });
  })(doc.body);
  return doc.body.innerHTML;
}
function toHtml(v) {
  v = v || "";
  if (/<\/?[a-z][^>]*>/i.test(v)) return v;
  const d = document.createElement("div"); d.textContent = v; return d.innerHTML.replace(/\n/g, "<br>");
}
const hasContent = h => { const d = document.createElement("div"); d.innerHTML = h; return !!(d.textContent.trim() || d.querySelector("img")); };

function setRatio(el, im) { if (el && im.naturalWidth && im.naturalHeight) el.style.setProperty("--r", (im.naturalWidth / im.naturalHeight).toFixed(4)); }
function art(el, src, alt, cb) {
  el.textContent = "";
  if (ok(src)) { const i = new Image(); if (cb) i.onload = () => cb(i); i.src = src; i.alt = alt; i.decoding = "async"; i.onerror = () => { el.innerHTML = PH; }; el.appendChild(i); }
  else el.innerHTML = PH;
}
function render() {
  const d = DATA;
  document.documentElement.style.setProperty("--accent", /^#[0-9a-f]{3,8}$/i.test(d.accent) ? d.accent : "#e08d84");
  document.title = d.name + " · 프로필";
  $("sig").textContent = d.nameEn || d.name;
  $("pName").textContent = d.nameSub || ""; $("pSub").textContent = d.inscription || "";
  $("plaque").hidden = !(d.nameSub || d.inscription);
  const dh = clean(toHtml(d.detail)); $("detail").innerHTML = dh; $("detail").hidden = !hasContent(dh);
  buildSlider((d.slides && d.slides.length ? d.slides : [d.mainImage]).filter(ok));
}

/* ---- 편집 폼 <-> 데이터 ---- */
const FIELDS = [["name","이름"],["nameEn","배너 이름 (영문, Pencerio 글꼴)"],["nameSub","이름 아래 명판 — 윗줄"],["inscription","이름 아래 명판 — 아랫줄"],["detail","캐릭터 상세 (서식·사진 가능)","rich"],["slides","상단 슬라이드 이미지 (한 줄에 URL 하나)",1],["accent","강조 색 (#hex)"]];
const ENC = { slides: d => (d.slides || []).join("\n") };
const DEC = { slides: s => s.split("\n").map(x => x.trim()).filter(Boolean) };
/* ---- 서식 입력창 (굵게·기울임·밑줄·크기·색·사진 등) ---- */
let RICH = {}, rteEl = null, rteRange = null;
document.addEventListener("selectionchange", () => {
  const sl = getSelection();
  if (rteEl && sl.rangeCount && rteEl.contains(sl.anchorNode)) rteRange = sl.getRangeAt(0).cloneRange();
});
const emsg = t => { $("editMsg").textContent = t || ""; };
function restoreSel() {
  rteEl.focus();
  if (rteRange) { const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rteRange); }
}
function wrapStyle(prop, val) {
  restoreSel();
  const sl = getSelection(); if (!sl.rangeCount) return;
  const r = sl.getRangeAt(0);
  if (!rteEl.contains(r.commonAncestorContainer)) return;
  if (r.collapsed) { emsg("바꿀 글자를 먼저 드래그해서 선택해 주세요."); return; }
  emsg("");
  const sp = document.createElement("span"); sp.style[prop] = val;
  sp.appendChild(r.extractContents());
  const kebab = prop.replace(/[A-Z]/g, m => "-" + m.toLowerCase());
  sp.querySelectorAll("*").forEach(el => el.style && el.style.removeProperty(kebab));
  r.insertNode(sp);
  const nr = document.createRange(); nr.selectNodeContents(sp); sl.removeAllRanges(); sl.addRange(nr); rteRange = nr.cloneRange();
}
function fileToDataUrl(f) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(f.type)) return rej(new Error("이미지 파일만 넣을 수 있어요."));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("파일을 읽지 못했어요."));
    fr.onload = () => {
      if (f.type === "image/gif") { if (fr.result.length > 1.5e6) return rej(new Error("GIF가 너무 커요. 링크로 넣어 주세요.")); return res(fr.result); }
      const im = new Image();
      im.onerror = () => rej(new Error("이미지를 열지 못했어요."));
      im.onload = () => {
        const sc = Math.min(1, 1200 / im.naturalWidth), c = document.createElement("canvas");
        c.width = Math.round(im.naturalWidth * sc); c.height = Math.round(im.naturalHeight * sc);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        let u = c.toDataURL("image/webp", .85);
        if (!u.startsWith("data:image/webp")) u = c.toDataURL(f.type === "image/png" ? "image/png" : "image/jpeg", .85);
        res(u);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
}
function makeRich(host, key, html) {
  const sizes = [12, 14, 16, 18, 20, 24, 28, 32, 40, 48];
  host.innerHTML = `
  <div class="rtbar">
    <button type="button" data-c="bold" title="굵게"><b>B</b></button>
    <button type="button" data-c="italic" title="기울임"><i>I</i></button>
    <button type="button" data-c="underline" title="밑줄"><u>U</u></button>
    <button type="button" data-c="strikeThrough" title="취소선"><s>S</s></button>
    <i class="sep"></i>
    <select data-s="size" title="글자 크기"><option value="">크기</option>${sizes.map(n => `<option value="${n}">${n}px</option>`).join("")}</select>
    <select data-s="font" title="글꼴"><option value="">글꼴</option><option value="'Gowun Batang',serif">명조</option><option value="'Gowun Dodum',sans-serif">고딕</option><option value="'Pencerio-Hairline','Gowun Batang',serif">필기체</option></select>
    <label class="mini">글자색 <input type="color" data-k="fore" value="#1d4560"></label>
    <label class="mini">형광펜 <input type="color" data-k="back" value="#fff3a8"></label>
    <i class="sep"></i>
    <button type="button" data-c="justifyLeft" title="왼쪽 정렬">⇤</button>
    <button type="button" data-c="justifyCenter" title="가운데 정렬">↔</button>
    <button type="button" data-c="justifyRight" title="오른쪽 정렬">⇥</button>
    <button type="button" data-c="removeFormat" title="서식 지우기">서식 지움</button>
  </div>
  <div class="rtbar">
    <input type="text" data-i="url" placeholder="이미지 링크 (https://…)" autocomplete="off">
    <button type="button" data-a="addurl">링크로 넣기</button>
    <button type="button" data-a="addfile">사진 파일</button>
    <input type="file" data-i="file" accept="image/*" hidden>
    <select data-s="imgw" title="선택한 사진 크기"><option value="">사진 크기</option><option value="25">25%</option><option value="50">50%</option><option value="75">75%</option><option value="100">100%</option></select>
    <button type="button" data-a="imgdel">사진 삭제</button>
  </div>
  <div class="rte" contenteditable="true" data-ph="캐릭터 상세를 적어 주세요. 글자를 드래그해서 서식을 바꾸고, 사진은 위에서 넣어요."></div>`;
  const rte = host.querySelector(".rte"), q = sel => host.querySelector(sel);
  rte.innerHTML = clean(toHtml(html));
  let selImg = null;
  rte.addEventListener("focus", () => { rteEl = rte; });
  rte.addEventListener("click", e => {
    rte.querySelectorAll("img.sel").forEach(i => i.classList.remove("sel"));
    selImg = e.target.tagName === "IMG" ? e.target : null;
    if (selImg) selImg.classList.add("sel");
  });
  host.addEventListener("mousedown", e => { if (e.target.closest("button")) e.preventDefault(); });
  const exec = (c, v) => { rteEl = rte; restoreSel(); document.execCommand("styleWithCSS", false, true); return document.execCommand(c, false, v); };
  host.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    const c = b.dataset.c;
    if (/^justify/.test(c) && selImg) {
      selImg.style.display = "block";
      selImg.style.margin = { justifyLeft: "8px auto 8px 0", justifyCenter: "8px auto", justifyRight: "8px 0 8px auto" }[c];
      return;
    }
    exec(c);
  });
  q('[data-s=size]').onchange = e => { const v = e.target.value; e.target.value = ""; if (v) { rteEl = rte; wrapStyle("fontSize", v + "px"); } };
  q('[data-s=font]').onchange = e => { const v = e.target.value; e.target.value = ""; if (v) { rteEl = rte; wrapStyle("fontFamily", v); } };
  q('[data-k=fore]').onchange = e => { exec("foreColor", e.target.value); };
  q('[data-k=back]').onchange = e => { exec("hiliteColor", e.target.value) || exec("backColor", e.target.value); };
  const addImg = src => {
    if (!/^(https?:\/\/|data:image\/)/i.test(src)) { emsg("https:// 로 시작하는 이미지 링크를 넣어 주세요."); return; }
    emsg(""); exec("insertImage", src);
  };
  q('[data-a=addurl]').onclick = () => { const i = q('[data-i=url]'), v = i.value.trim(); if (!v) return; addImg(v); i.value = ""; };
  q('[data-i=url]').addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); q('[data-a=addurl]').click(); } });
  q('[data-a=addfile]').onclick = () => q('[data-i=file]').click();
  q('[data-i=file]').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    emsg("사진 불러오는 중…");
    try { addImg(await fileToDataUrl(f)); } catch (err) { emsg(err.message); }
  };
  q('[data-s=imgw]').onchange = e => {
    const v = e.target.value; e.target.value = ""; if (!v) return;
    if (!selImg) { emsg("사진을 먼저 눌러서 선택해 주세요."); return; }
    emsg(""); selImg.style.width = v + "%"; selImg.style.height = "auto";
  };
  q('[data-a=imgdel]').onclick = () => { if (!selImg) { emsg("삭제할 사진을 먼저 눌러서 선택해 주세요."); return; } selImg.remove(); selImg = null; };
  RICH[key] = () => {
    const c = rte.cloneNode(true); c.querySelectorAll("img.sel").forEach(i => i.classList.remove("sel"));
    const h = clean(c.innerHTML); return hasContent(h) ? h : "";
  };
}
function openEditor() {
  $("fields").textContent = ""; emsg(""); RICH = {}; rteEl = null; rteRange = null;
  $("editForm").classList.add("wide");
  FIELDS.forEach(([k, label, area]) => {
    if (area === "rich") {
      const t = document.createElement("div"); t.className = "lab"; t.textContent = label;
      const h = document.createElement("div"); $("fields").append(t, h); makeRich(h, k, DATA[k]); return;
    }
    const l = document.createElement("label"); l.textContent = label;
    const f = document.createElement(area ? "textarea" : "input"); f.name = k;
    f.value = ENC[k] ? ENC[k](DATA) : (DATA[k] || "");
    l.appendChild(f); $("fields").appendChild(l);
  });
  $("editor").showModal();
}
$("editForm").onsubmit = async e => {
  e.preventDefault();
  const next = {};
  FIELDS.forEach(([k]) => { if (RICH[k]) { next[k] = RICH[k](); return; } const v = $("editForm").elements[k].value; next[k] = DEC[k] ? DEC[k](v) : v.trim(); });
  if (JSON.stringify(next).length > 1500000) { emsg("내용이 너무 커요. 사진이 많거나 커서 그래요. 큰 사진은 링크로 넣어 주세요."); return; }
  $("editMsg").textContent = "저장 중…";
  const { error } = await sb.from(CFG.TABLE).upsert({ id: 1, data: next, updated_at: new Date().toISOString() });
  if (error) { $("editMsg").textContent = "저장하지 못했어요: " + error.message; return; }
  DATA = next; render(); $("editor").close();
};

/* ---- 상단 슬라이드 ---- */
const still = matchMedia("(prefers-reduced-motion:reduce)");
let idx = 0, n = 1, timer;
function buildSlider(urls) {
  $("slides").textContent = ""; $("dots").textContent = "";
  const list = urls.length ? urls : [""]; n = list.length;
  list.forEach((u, i) => {
    const sl = document.createElement("div"); sl.className = "slide"; art(sl, u, DATA.name + " 일러스트 " + (i + 1), i === 0 ? im => setRatio(document.querySelector("header.top"), im) : null); $("slides").appendChild(sl);
    const d = document.createElement("button"); d.type = "button"; d.setAttribute("aria-label", (i + 1) + "번째 이미지"); d.onclick = () => go(i); $("dots").appendChild(d);
  });
  $("slider").classList.toggle("one", n < 2); go(0);
}
function go(i) {
  idx = (i + n) % n; $("slides").style.transform = `translateX(${-idx * 100}%)`;
  [...$("dots").children].forEach((d, k) => d.classList.toggle("on", k === idx));
  clearInterval(timer); if (n > 1 && !still.matches) timer = setInterval(() => go(idx + 1), 6000);
}
$("prev").onclick = () => go(idx - 1); $("next").onclick = () => go(idx + 1);
let sx = null;
$("slider").addEventListener("pointerdown", e => { sx = e.clientX; });
addEventListener("pointerup", e => { if (sx === null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 50 && n > 1) go(idx + (dx < 0 ? 1 : -1)); });

/* ---- 로그인 ---- */
const setAdmin = on => $("bar").classList.toggle("on", !!on);
$("adminLink").onclick = () => {
  if (!sb) { alert("수퍼베이스 URL과 anon key를 먼저 설정해 주세요."); return; }
  $("loginMsg").textContent = ""; $("login").showModal();
};
$("loginForm").onsubmit = async e => {
  e.preventDefault(); $("loginMsg").textContent = "확인 중…";
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value, password: $("pw").value });
  if (error) { $("loginMsg").textContent = "로그인하지 못했어요. 이메일과 비밀번호를 확인해 주세요."; return; }
  $("pw").value = ""; $("login").close();
};
$("editBtn").onclick = openEditor;
$("outBtn").onclick = () => sb.auth.signOut();
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());

async function init() {
  render();
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || !window.supabase) return;
  sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((_ev, s) => setAdmin(s));
  const { data: s } = await sb.auth.getSession(); setAdmin(s.session);
  const { data } = await sb.from(CFG.TABLE).select("data").eq("id", 1).maybeSingle();
  if (data && data.data) { DATA = { ...DEFAULT, ...data.data }; render(); }
}
init();

/* ---- 터치하면 물거품 ---- */
let live = 0; const R = Math.random, rr = () => 40 + R() * 22 | 0;
const blob = () => `${rr()}% ${rr()}% ${rr()}% ${rr()}% / ${rr()}% ${rr()}% ${rr()}% ${rr()}%`;
addEventListener("pointerdown", e => {
  if (still.matches) return;
  const box = $("bubbles"), x = e.clientX, y = e.clientY;
  const r = document.createElement("span"); r.className = "rip"; r.style.cssText = `--x:${x}px;--y:${y}px`;
  r.onanimationend = () => r.remove(); box.appendChild(r);
  for (let k = 2 + (R() * 3 | 0); k--;) {            // 한 번에 2~4개
    if (live > 36) break;
    const s = 4 + R() ** 2 * 15, dy = 110 + R() * 150 + s * 4;   // 작은 거품 위주
    const b = document.createElement("span"); b.className = "bub";
    b.style.cssText = `--x:${x + (R() - .5) * 30}px;--y:${y + (R() - .5) * 14}px;--s:${s}px;--mx:${(R() - .5) * 34}px;--ex:${(R() - .5) * 44}px;--dx:${2 + R() * 7}px;--dy:${dy}px;--d:${dy / (55 + s * 3)}s;--sw:${.6 + R() * .8}s;--bl:${.9 + R() * 1.1}s;--b1:${blob()};--b2:${blob()};--w:${R() * .25}s`;
    b.appendChild(document.createElement("i"));
    live++; b.onanimationend = ev => { if (ev.target === b) { b.remove(); live--; } };
    box.appendChild(b);
  }
});
</script>
